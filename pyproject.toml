[project]
name = "aifra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiarash", email = "kowsarikiarash@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
aifra = "aifra:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
